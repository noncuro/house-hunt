# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "rightmove-extension"

[api]
enabled = true
# Port to use for the API URL.
port = 54341
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. public and storage are always included.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54342
# Port used by db diff command to initialize the shadow database.
shadow_port = 54340
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54349
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv6)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54343
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54344
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://127.0.0.1:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
#
# FALSE, and this is the enforcement — not `shouldCreateUser: false` in the client, which is a
# request parameter anyone holding the publishable key can simply not send. With signup enabled, a
# stranger with the key calls signup directly, gets a real authenticated account with no invite,
# and inherits everything granted `to authenticated`: the shared listing cache and the fact-writing
# RPCs. Invite-only is a property of this setting and of nothing else.
#
# It is false here so a local run exercises the boundary we actually ship. It must also be false in
# the hosted project — that is a dashboard setting this file does not reach, and it is the one
# cutover step that cannot be skipped.
enable_signup = false
# Ten, matching MIN_PASSWORD_LENGTH in src/lib/messages.ts and in
# supabase/functions/password/index.ts. It belongs to [auth] and not to [auth.email] — the CLI
# reports an unknown field there rather than refusing, so a misplaced line is a rule that silently
# is not applied. The two checks in the code are the ones a person actually meets, and they say so
# in a sentence; this is the backstop under them.
minimum_password_length = 10

# Allow/disallow testing manual linking of accounts
enable_manual_linking = false

[auth.email]
# TRUE, and it has to be on this CLI, which is the opposite of what it looks like.
#
# First, the thing that makes this safe at all: **this file configures the local stack and nothing
# else.** There is no `supabase config push` in this CLI (1.145.4) — the command does not exist —
# so nothing here can reach the hosted project, which is configured in the dashboard. Every line in
# this file is a statement about a container on somebody's laptop or on a CI runner.
#
# In the hosted project the email provider genuinely has its own signup switch and it must be off.
# The CLI does not have that switch: version 1.145.4 maps this single field onto GoTrue's
# `EXTERNAL_EMAIL_ENABLED`, which governs email *login*, not email signup. Setting it false turns
# the local stack into one where nobody can sign in at all — every password sign-in comes back
# "Email logins are disabled", which is a sentence about the wrong thing and sends you looking at
# passwords and RLS.
#
# That is not a hypothetical: it is what broke the browser harnesses. `smoke` and `check:rls` both
# begin by signing a fixture user in, so both died at their first step, and only on a *freshly
# started* stack — a container started before this line existed kept working, so it presented as
# random flakiness rather than as a config error.
#
# Invite-only does not depend on this. It is `enable_signup = false` under [auth] above, which the
# CLI maps to `GOTRUE_DISABLE_SIGNUP=true`, and that refuses `signUp()` outright. `check:rls`
# asserts exactly that, so the property we are relying on here is tested rather than assumed.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
#
# FALSE, and it has to be, because NOTHING IN THIS SYSTEM SENDS EMAIL. An account is created by the
# `password` Edge Function with `email_confirm: true` already set, against an invite code delivered
# by hand. With confirmations on, a new account would sit unconfirmed waiting for a message that
# will never be sent, and the only symptom is a sign-in that refuses a correct password.
# It must also be off in the hosted project — Authentication -> Providers -> Email -> Confirm email
# — which is a dashboard setting this file does not reach. See SETUP.md.
enable_confirmations = false

# Uncomment to customize email template
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# There is deliberately no [auth.email.template.magic_link] stanza and no template file any more.
# Sign-in was a six-digit code sent by Supabase's built-in sender, which stops at roughly two
# messages an hour per project — a limit the owner met in ordinary use, and one that only lifts by
# running SMTP. The dependency was removed instead: an invite carries a code delivered out of band,
# and sign-in is a password. Nothing here has a reason to send mail, so nothing here has a template.

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = true
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }} ."

# Use pre-defined map of phone number to OTP for testing.
[auth.sms.test_otp]
# 4152127777 = "123456"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
[auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"


# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth redirectUrl.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""

# The one function the platform must not verify a JWT for. Redeeming an invite is done by somebody
# who has no account yet, so there is no token to present; the function checks the invite code
# instead and rate-limits guessing in the database. Its other half (an admin setting a password)
# calls `requireCaller` itself, precisely because this line means nothing verified it first.
[functions.password]
verify_jwt = false

[analytics]
enabled = false
port = 54347
vector_port = 54348
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"
